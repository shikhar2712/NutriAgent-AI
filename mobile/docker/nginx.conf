server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /index.html { add_header Cache-Control "no-cache" always; }
    location ~* \.(js|css|json|png|svg)$ { add_header Cache-Control "public, max-age=3600" always; }

    location = /NutriAgent.apk {
        types { } default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="NutriAgent.apk"' always;
    }

    location / { try_files $uri $uri/ =404; }
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#F8FAFC"/>
  <text x="60" y="78" font-size="40" font-weight="700" fill="#0F172A">NutriAgent AI: how a lab report becomes a plan</text>
  <text x="60" y="116" font-size="22" fill="#64748B">Code decides the numbers. The local model only writes the words around them.</text>

  <rect x="60" y="190" width="220" height="150" rx="14" fill="#fff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="82" y="230" font-size="14" font-weight="700" fill="#64748B" letter-spacing="1">1  INPUT</text>
  <text x="82" y="272" font-size="25" font-weight="700" fill="#0F172A">Lab report PDF</text>
  <text x="82" y="302" font-size="18" fill="#64748B">text-based, no OCR</text>

  <rect x="320" y="190" width="270" height="150" rx="14" fill="#fff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="342" y="230" font-size="14" font-weight="700" fill="#64748B" letter-spacing="1">2  EXTRACT  (regex)</text>
  <text x="342" y="272" font-size="25" font-weight="700" fill="#0F172A">Health profile</text>
  <text x="342" y="302" font-size="18" fill="#64748B">25+ biomarkers, ranges, flags</text>
  <text x="342" y="326" font-size="16" fill="#94A3B8">pdfplumber, pypdf fallback</text>

  <rect x="630" y="170" width="340" height="190" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
  <text x="652" y="210" font-size="14" font-weight="700" fill="#047857" letter-spacing="1">3  DETERMINISTIC ENGINE  (Python)</text>
  <text x="652" y="252" font-size="25" font-weight="700" fill="#0F172A">The numbers</text>
  <text x="652" y="286" font-size="18" fill="#0F172A">Mifflin-St Jeor BMR / TDEE</text>
  <text x="652" y="311" font-size="18" fill="#0F172A">Macros, limits, stacked protocols</text>
  <text x="652" y="336" font-size="18" fill="#0F172A">7-day plan from ICMR-NIN tables</text>

  <rect x="1010" y="170" width="320" height="190" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="3"/>
  <text x="1032" y="210" font-size="14" font-weight="700" fill="#0369A1" letter-spacing="1">4  LOCAL LLM  (Qwen2.5, Ollama)</text>
  <text x="1032" y="252" font-size="25" font-weight="700" fill="#0F172A">The words</text>
  <text x="1032" y="286" font-size="18" fill="#0F172A">Analysis agent</text>
  <text x="1032" y="311" font-size="18" fill="#0F172A">Nutrition agent</text>
  <text x="1032" y="336" font-size="18" fill="#0F172A">Audit write-up, Q&amp;A chat</text>

  <rect x="1370" y="190" width="180" height="150" rx="14" fill="#0F172A"/>
  <text x="1392" y="230" font-size="14" font-weight="700" fill="#94A3B8" letter-spacing="1">5  OUTPUT</text>
  <text x="1392" y="268" font-size="21" font-weight="700" fill="#fff">Dashboard</text>
  <text x="1392" y="296" font-size="21" font-weight="700" fill="#fff">7-day plan</text>
  <text x="1392" y="324" font-size="21" font-weight="700" fill="#fff">Doctor Brief</text>

  <g stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arr)">
    <line x1="282" y1="265" x2="316" y2="265"/>
    <line x1="592" y1="265" x2="626" y2="265"/>
    <line x1="972" y1="265" x2="1006" y2="265"/>
    <line x1="1332" y1="265" x2="1366" y2="265"/>
  </g>
  <text x="990" y="150" font-size="16" fill="#0369A1" text-anchor="middle" font-weight="600">targets go to the model as mandatory constraints</text>

  <rect x="630" y="430" width="700" height="130" rx="14" fill="#fff" stroke="#F59E0B" stroke-width="3"/>
  <text x="652" y="468" font-size="14" font-weight="700" fill="#B45309" letter-spacing="1">AUDIT GATE  (code, not the model)</text>
  <text x="652" y="504" font-size="22" font-weight="700" fill="#0F172A">Constraint checks on the finished plan</text>
  <text x="652" y="532" font-size="17" fill="#64748B">calories near target  |  no contraindicated food</text>
  <text x="652" y="552" font-size="17" fill="#64748B">protocols stacked  |  meals traceable to NIN tables</text>
  <path d="M800 362 L800 426" stroke="#F59E0B" stroke-width="3" fill="none" marker-end="url(#arrA)"/>
  <path d="M1332 495 C1440 495 1460 430 1460 346" stroke="#F59E0B" stroke-width="3" fill="none" marker-end="url(#arrA)"/>

  <rect x="60" y="430" width="530" height="130" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="82" y="468" font-size="14" font-weight="700" fill="#64748B" letter-spacing="1">IF OLLAMA IS OFFLINE</text>
  <text x="82" y="504" font-size="22" font-weight="700" fill="#0F172A">Every agent has a template fallback</text>
  <text x="82" y="532" font-size="17" fill="#64748B">built from the engine's output, so the app</text>
  <text x="82" y="552" font-size="17" fill="#64748B">still runs end to end</text>

  <rect x="60" y="640" width="1490" height="170" rx="14" fill="#0F172A"/>
  <text x="95" y="688" font-size="14" font-weight="700" fill="#94A3B8" letter-spacing="1">ANDROID APP  (about 0.5 MB, works offline)</text>
  <text x="95" y="734" font-size="28" font-weight="700" fill="#fff">The same engine, re-implemented in JavaScript</text>
  <text x="95" y="772" font-size="20" fill="#CBD5E1">Runs in a WebView on the phone. pdf.js reads the PDF on the device. Ollama is optional.</text>
  <rect x="1130" y="680" width="380" height="96" rx="12" fill="#10B981"/>
  <text x="1320" y="722" font-size="32" font-weight="800" fill="#06281D" text-anchor="middle">1,033 parity checks</text>
  <text x="1320" y="754" font-size="18" fill="#06281D" text-anchor="middle">JS engine vs the Python original</text>
  <text x="60" y="864" font-size="16" fill="#94A3B8">Educational project, not a medical device. github.com/shikhar2712/NutriAgent-AI</text>
</svg>
